      // HR Attrition Simulator State
      const [yearsAtCompany, setYearsAtCompany] = useState(3);
      const [overtime, setOvertime] = useState("Yes");
      const [satisfaction, setSatisfaction] = useState(2); // 1 to 5

      const attritionRisk = useMemo(() => {
        let score = 50;
        if (overtime === "Yes") score += 25;
        if (satisfaction <= 2) score += 25;
        else if (satisfaction >= 4) score -= 25;
        if (yearsAtCompany < 2) score += 15;
        if (yearsAtCompany > 5) score -= 15;
        
        score = Math.min(Math.max(score, 5), 95);
        let level = score > 60 ? "High Risk" : (score > 35 ? "Moderate Risk" : "Low Retention Risk");
        let badgeColor = score > 60 ? "text-danger" : (score > 35 ? "text-warning" : "text-success");
        return { score, level, badgeColor };

              <span className="section-tag">Academic Background</span>
              <h2 className="section-title">Education & <span className="text-gradient-blue">Credentials</span></h2>
              <p className="section-desc">
                Engineering foundation in Computer Science along with consistent academic excellence.
              </p>
            </div>

            <div className="row justify-content-center">
              <div className="col-lg-9">
                {EDUCATION_DATA.map((item, idx) => (
                  <div key={idx} className="glass-card timeline-card">
                    <div className="d-flex flex-wrap justify-content-between align-items-center mb-2">
                      <span className="timeline-year">{item.period}</span>
                      <span className="badge bg-success-subtle text-success border border-success px-3 py-1 rounded-pill">
                        {item.grade}
                      </span>
                    </div>

                    <h4 className="fs-5 fw-bold mb-1 text-dark">{item.degree}</h4>
                    <div className="text-primary fw-semibold small mb-2">
                      <i className="fa-solid fa-graduation-cap me-1"></i> {item.institution}
                    </div>

                    <p className="text-muted small mb-0">
                      {item.description}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </div>

    // --- COMPONENT: CONTACT SECTION ---
    function ContactSection() {
      const [formData, setFormData] = useState({
        name: "",
        company: "",
        email: "",
        role: "Data Analyst",
        message: ""
      });
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
        if (window.confetti) {
          window.confetti({ particleCount: 70, spread: 70 });
        }
      };

      const mailtoLink = `mailto:${CANDIDATE_INFO.email}?subject=${encodeURIComponent("Interview Inquiry: " + formData.role + " - " + formData.company)}&body=${encodeURIComponent("Hi Maveen,\n\n" + formData.message + "\n\nBest regards,\n" + formData.name + "\n" + formData.company + "\n" + formData.email)}`;

      return (
        <section id="contact" className="py-5">
          <div className="container">
            <div className="text-center mb-5">
              <span className="section-tag">Get In Touch</span>
              <h2 className="section-title">Schedule an <span className="text-gradient-blue">Interview</span></h2>
              <p className="section-desc">
                Looking for a proactive, results-oriented Data Analyst to turn raw datasets into high-value dashboards? 
                Reach out directly or send an interview invitation.
              </p>
            </div>

            <div className="row gy-5">
              {/* Direct Contacts */}
              <div className="col-lg-5">
                <h4 className="fw-bold mb-4 text-dark">Direct Contact Channels</h4>

                <a href={`mailto:${CANDIDATE_INFO.email}`} className="contact-link-card">
                  <div className="contact-link-icon">
                    <i className="fa-solid fa-envelope"></i>
                  </div>
                  <div>
                    <div className="text-muted small text-uppercase fw-bold">Email Address</div>
                    <div className="fw-semibold text-dark">{CANDIDATE_INFO.email}</div>
                  </div>
                </a>

                <a href={`tel:${CANDIDATE_INFO.phoneClean}`} className="contact-link-card">
                  <div className="contact-link-icon">
                    <i className="fa-solid fa-phone"></i>
                  </div>
                  <div>
                    <div className="text-muted small text-uppercase fw-bold">Phone / WhatsApp</div>
                    <div className="fw-semibold text-dark">{CANDIDATE_INFO.phone}</div>
                  </div>
                </a>

                <a href={CANDIDATE_INFO.github} target="_blank" rel="noreferrer" className="contact-link-card">
                  <div className="contact-link-icon">
                    <i className="fa-brands fa-github"></i>
                  </div>
                  <div>
                    <div className="text-muted small text-uppercase fw-bold">GitHub Profile</div>
                    <div className="fw-semibold text-dark">github.com/maveenganthirajan-arch</div>
                  </div>
                </a>

                <a href={CANDIDATE_INFO.leetcode} target="_blank" rel="noreferrer" className="contact-link-card">
                  <div className="contact-link-icon">
                    <i className="fa-solid fa-code"></i>
                  </div>
                  <div>
                    <div className="text-muted small text-uppercase fw-bold">LeetCode Profile</div>
                    <div className="fw-semibold text-dark">leetcode.com/u/gqSuIZqIeW</div>
                  </div>
                </a>

                <div className="contact-link-card">
                  <div className="contact-link-icon">
                    <i className="fa-solid fa-location-dot"></i>
                  </div>
                  <div>
                    <div className="text-muted small text-uppercase fw-bold">Location</div>
                    <div className="fw-semibold text-dark">{CANDIDATE_INFO.location}</div>
                  </div>
                </div>

                {/* Direct Download Card */}
                <div className="mt-4 p-4 rounded-4 bg-primary-subtle border border-primary-subtle text-center">
                  <h6 className="fw-bold text-dark mb-2">Need a verified copy of my resume?</h6>
                  <p className="text-muted small mb-3">Download the full resume in PDF format.</p>
                  <a href={CANDIDATE_INFO.resumePdf} target="_blank" rel="noreferrer" className="btn btn-cyan btn-sm">
                    <i className="fa-solid fa-file-pdf"></i> Download Resume (PDF)
                  </a>
                </div>
              </div>

              {/* Form */}
              <div className="col-lg-7">
                <div className="glass-card p-4 p-md-5">
                  <h4 className="fw-bold mb-3 text-dark">Send Interview Invitation</h4>
                  <p className="text-muted small mb-4">
                    Fill out the form below to initiate an email conversation directly with Maveen G.
                  </p>

                  {submitted ? (
                    <div className="text-center py-4">
                      <div className="fs-1 text-success mb-3">
                        <i className="fa-solid fa-circle-check"></i>
                      </div>
                      <h4 className="fw-bold text-success mb-2">Ready to Dispatch!</h4>
                      <p className="text-muted mb-4">
                        Thank you for reaching out! Click below to send this directly via your email client, or copy the pre-filled text.
                      </p>
                      <a href={mailtoLink} className="btn btn-cyan mb-2">
                        <i className="fa-solid fa-paper-plane"></i> Launch Default Mail App
                      </a>
                      <br/>
                      <button 
                        className="btn btn-link text-primary small" 
                        onClick={() => setSubmitted(false)}
                      >
                        Edit Information
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleSubmit}>
                      <div className="row g-3">
                        <div className="col-md-6">
                          <label className="form-label small text-muted">Your Name / Recruiter Name *</label>
                          <input 
                            type="text" 
                            className="form-control form-control-custom" 
                            required 
                            placeholder="e.g. Sarah Jenkins"
                            value={formData.name}
                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                          />
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small text-muted">Company / Organization *</label>
                          <input 
                            type="text" 
                            className="form-control form-control-custom" 
                            required 
                            placeholder="e.g. Analytics Corp"
                            value={formData.company}
                            onChange={(e) => setFormData({...formData, company: e.target.value})}
                          />
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small text-muted">Your Email *</label>
                          <input 
                            type="email" 
                            className="form-control form-control-custom" 
                            required 
                            placeholder="recruiter@company.com"
                            value={formData.email}
                            onChange={(e) => setFormData({...formData, email: e.target.value})}
                          />
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small text-muted">Position / Role</label>
                          <select 
                            className="form-select form-control-custom"
                            value={formData.role}
                            onChange={(e) => setFormData({...formData, role: e.target.value})}
                          >
                            <option value="Data Analyst">Data Analyst</option>
                            <option value="BI Analyst / Power BI Developer">BI Analyst / Power BI Developer</option>
                            <option value="Business Analyst">Business Analyst</option>
                            <option value="SQL / Database Specialist">SQL / Database Specialist</option>
                            <option value="General Conversation">General Conversation</option>
                          </select>
                        </div>
                        <div className="col-12">
                          <label className="form-label small text-muted">Message / Interview Schedule Details *</label>
                          <textarea 
                            className="form-control form-control-custom" 
                            rows="4" 
                            required
                            placeholder="Hi Maveen, we came across your portfolio and would love to schedule a preliminary interview for our Data Analyst opening..."
                            value={formData.message}
                            onChange={(e) => setFormData({...formData, message: e.target.value})}
                          ></textarea>
                        </div>
                        <div className="col-12 mt-4">
                          <button type="submit" className="btn btn-cyan w-100 justify-content-center">
                            <i className="fa-solid fa-paper-plane"></i> Submit & Open Email Client
                          </button>
                        </div>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- COMPONENT: MODAL DETAIL (Light Mode) ---
    function ProjectDetailModal({ project, onClose }) {
      if (!project) return null;

      return (
        <div className="modal fade show d-block" tabIndex="-1" style={{ backgroundColor: 'rgba(15, 23, 42, 0.65)', zIndex: 1050 }}>
          <div className="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div className="modal-content modal-content-custom">
              <div className="modal-header border-bottom pb-3">
                <div>
                  <span className="badge bg-primary-subtle text-primary border border-primary-subtle mb-1">
                    {project.domain} • {project.category}
                  </span>
                  <h4 className="modal-title fw-bold text-dark mb-0">{project.title}</h4>
                </div>
                <button type="button" className="btn-close" onClick={onClose}></button>
              </div>

              <div className="modal-body py-4">
                <div className="mb-4">
                  <h6 className="fw-bold text-primary text-uppercase small letter-spacing-1">Technologies & Tools</h6>
                  <div className="d-flex flex-wrap gap-1 mt-2">
                    {project.tech.map((t, idx) => (
                      <span key={idx} className="tech-tag-badge">
                        {t}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="mb-4">
                  <h6 className="fw-bold text-primary text-uppercase small letter-spacing-1">
                    <i className="fa-solid fa-triangle-exclamation me-1"></i> Business Problem Statement
                  </h6>
                  <p className="text-body small">
                    {project.deepDive.problem}
                  </p>
                </div>

                <div className="mb-4">
                  <h6 className="fw-bold text-primary text-uppercase small letter-spacing-1">
                    <i className="fa-solid fa-gears me-1"></i> Analytical Methodology & Execution
                  </h6>
                  <p className="text-body small">
                    {project.deepDive.methodology}
                  </p>
                </div>

                <div className="mb-4">
                  <h6 className="fw-bold text-primary text-uppercase small letter-spacing-1">
                    <i className="fa-solid fa-box-archive me-1"></i> Core Deliverables
                  </h6>
                  <p className="text-body small">
                    {project.deepDive.deliverables}
                  </p>
                </div>

                <div className="p-3 rounded-3 bg-success-subtle border border-success-subtle mb-3">
                  <h6 className="fw-bold text-success text-uppercase small letter-spacing-1 mb-1">
                    <i className="fa-solid fa-chart-line me-1"></i> Measurable Business Impact
                  </h6>
                  <p className="text-dark small mb-0">
                    {project.deepDive.impact}
                  </p>
                </div>

                <div>
                  <h6 className="fw-bold text-primary text-uppercase small letter-spacing-1 mb-2">Resume Key Bullets</h6>
                  {project.highlights.map((bullet, idx) => (
                    <div key={idx} className="project-bullet small">
                      {bullet}
                    </div>
                  ))}
                </div>
              </div>

              <div className="modal-footer border-top">
                <a 
                  href={project.github} 
                  target="_blank" 
                  rel="noreferrer" 
                  className={`btn ${project.id === 'banking-management-system' ? 'btn-primary' : 'btn-outline-glass'}`}
                >
                  <i className="fa-brands fa-github me-1"></i> 
                  {project.id === 'banking-management-system' ? 'Open Banking MySQL Repo ↗' : 'GitHub Repository ↗'}
                </a>
                <button type="button" className="btn btn-cyan" onClick={onClose}>
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENT: FOOTER ---
    function Footer() {
      return (
        <footer>
          <div className="container text-center">
            <div className="d-flex justify-content-center gap-3 mb-3">
              <a href={CANDIDATE_INFO.github} target="_blank" rel="noreferrer" className="text-secondary hover-cyan">
                <i className="fa-brands fa-github fs-5"></i>
              </a>
              <a href={CANDIDATE_INFO.leetcode} target="_blank" rel="noreferrer" className="text-secondary hover-cyan">
                <i className="fa-solid fa-code fs-5"></i>
              </a>
              <a href={`mailto:${CANDIDATE_INFO.email}`} className="text-secondary hover-cyan">
                <i className="fa-solid fa-envelope fs-5"></i>
              </a>
              <a href={`tel:${CANDIDATE_INFO.phoneClean}`} className="text-secondary hover-cyan">
                <i className="fa-solid fa-phone fs-5"></i>
              </a>
            </div>
            <p className="mb-1 text-dark">
              Crafted with <strong className="text-primary">React JS & Bootstrap 5</strong> for <strong>Maveen G</strong> | Data Analyst & BI Specialist
            </p>
            <p className="small text-muted mb-0">
              Salem, Tamil Nadu, India • B.E. Computer Science and Engineering (Kongu Engineering College)
            </p>
          </div>
        </footer>
      );
    }

    // --- MAIN APP ROOT ---
    function App() {
      const [activeModalProject, setActiveModalProject] = useState(null);
      const [showScrollTop, setShowScrollTop] = useState(false);

      useEffect(() => {
        const checkScroll = () => {
          setShowScrollTop(window.scrollY > 400);
        };
        window.addEventListener("scroll", checkScroll);
        return () => window.removeEventListener("scroll", checkScroll);
      }, []);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div>
          <Navbar />
          <Hero />
          <MetricsRibbon />
          <AboutSection />
          <ProjectsSection onOpenModal={(p) => setActiveModalProject(p)} />
          <InteractivePlayground />
          <SkillsSection />
          <EducationSection />
          <ContactSection />
          <Footer />

          {activeModalProject && (
            <ProjectDetailModal 
              project={activeModalProject} 
              onClose={() => setActiveModalProject(null)} 
            />
          )}

          {showScrollTop && (
            <button 
              className="btn-scroll-top" 
              onClick={scrollToTop} 
              title="Back to Top"
            >
              <i className="fa-solid fa-arrow-up"></i>
            </button>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
